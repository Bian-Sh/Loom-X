<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>OllamaHub Control Center — 控制台</title><style>
:root{color-scheme:dark;font-family:"Segoe UI",system-ui,sans-serif;--bg:#0e141b;--surface:#151d26;--surface2:#1d2833;--surface3:#24323e;--border:#2c3945;--text:#dce7ee;--muted:#9bafbc;--accent:#16b8c4;--info:#6da1ff;--ok:#35c98a;--warn:#f0b44d;--danger:#f47f84;--shadow:0 16px 42px rgba(0,0,0,.2)}*{box-sizing:border-box}html,body{margin:0;width:100%;min-height:100%;background:var(--bg);color:var(--text)}body{line-height:1.55}a,button,select,input{font:inherit}a{color:inherit;text-decoration:none}button{cursor:pointer}a:focus-visible,button:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:3px}.app{min-height:100vh;display:grid;grid-template-columns:240px minmax(0,1fr)}.rail{border-right:1px solid var(--border);padding:24px 16px;display:flex;flex-direction:column;gap:28px;background:rgba(21,29,38,.94)}.brand{display:flex;align-items:center;gap:11px;padding:0 10px}.brand-mark{width:34px;height:34px;border:2px solid var(--accent);border-radius:10px;display:grid;place-items:center;color:var(--accent);font-weight:800}.brand-name{font-weight:700}.brand-name span{color:var(--accent)}.brand small{display:block;color:var(--muted);font-size:10px}.nav{display:grid;gap:6px}.nav a{min-height:44px;padding:10px 12px;border-radius:8px;color:var(--muted);display:flex;align-items:center;gap:11px;font-size:14px}.nav a:hover,.nav a[aria-current=page]{color:var(--text);background:var(--surface3)}.nav a[aria-current=page]{box-shadow:inset 3px 0 var(--accent)}.nav-icon{width:20px;text-align:center;color:var(--accent);font-weight:700}.nav-divider{height:1px;background:var(--border);margin:4px 10px}.nav-label{padding:4px 12px;color:var(--muted);font-size:10px;letter-spacing:.12em;text-transform:uppercase}.rail-footer{margin-top:auto;border-top:1px solid var(--border);padding:18px 10px;color:var(--muted);font-size:12px}.rail-footer strong{color:var(--ok)}.main{min-width:0}.topbar{min-height:68px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;gap:16px;padding:0 clamp(18px,3vw,34px);background:rgba(21,29,38,.74);backdrop-filter:blur(16px)}.crumb{color:var(--muted);font-size:13px}.crumb strong{color:var(--text)}.stream-state{display:flex;align-items:center;gap:8px;color:var(--ok);font-size:12px}.dot{width:7px;height:7px;border-radius:50%;background:currentColor}.mobile-menu{display:none}.content{max-width:1500px;margin:auto;padding:clamp(20px,3vw,34px)}.page-head{display:flex;justify-content:space-between;align-items:flex-end;gap:18px;margin-bottom:16px}.page-head h1{font-size:clamp(25px,3vw,32px);line-height:1.15;letter-spacing:0;margin:0 0 5px}.page-head p{margin:0;color:var(--muted);font-size:14px}.actions{display:flex;gap:8px}.ghost,.primary{min-height:40px;padding:8px 13px;border:1px solid var(--border);border-radius:7px;background:var(--surface2);color:var(--text)}.ghost:hover{border-color:var(--accent);background:var(--surface3)}.primary{border-color:var(--accent);background:var(--accent);color:var(--bg);font-weight:700}.toolbar{display:flex;gap:9px;align-items:center;padding:10px;border:1px solid var(--border);border-bottom:0;border-radius:8px 8px 0 0;background:var(--surface);flex-wrap:wrap}.toolbar select,.toolbar input{min-height:40px;border:1px solid var(--border);border-radius:7px;background:var(--bg);color:var(--text);padding:8px 10px}.toolbar input{flex:1;min-width:210px}.check{display:flex;align-items:center;gap:7px;min-height:40px;padding:0 8px;color:var(--muted);font-size:12px}.check input{accent-color:var(--accent)}.console{border:1px solid var(--border);border-radius:0 0 8px 8px;background:#0b1117;box-shadow:var(--shadow);min-height:460px;max-height:calc(100vh - 260px);overflow:auto;font:12px/1.65 ui-monospace,SFMono-Regular,Consolas,monospace}.line{display:grid;grid-template-columns:92px 72px 84px minmax(0,1fr);gap:10px;padding:7px 12px;border-bottom:1px solid rgba(44,57,69,.52)}.line:hover{background:rgba(255,255,255,.025)}.time{color:#8fa5b2}.level{font-weight:700}.level.info{color:var(--info)}.level.warn{color:var(--warn)}.level.error{color:var(--danger)}.level.ok{color:var(--ok)}.module{color:#b7c7d0}.message{color:var(--text);overflow-wrap:anywhere}.redacted{color:var(--warn)}.empty{padding:60px 20px;text-align:center;color:var(--muted)}.footer{display:flex;justify-content:space-between;gap:12px;padding:9px 12px;border:1px solid var(--border);border-top:0;border-radius:0 0 8px 8px;color:var(--muted);font-size:11px;background:var(--surface)}.toast{position:fixed;right:22px;bottom:22px;max-width:min(390px,calc(100vw - 32px));padding:12px 15px;border:1px solid rgba(53,201,138,.42);border-radius:8px;background:#18352f;color:var(--text);box-shadow:var(--shadow);opacity:0;transform:translateY(10px);pointer-events:none;transition:.18s ease-out}.toast.show{opacity:1;transform:none}@media(max-width:900px){.app{grid-template-columns:72px minmax(0,1fr)}.rail{padding:22px 10px}.brand{justify-content:center}.brand-copy,.rail-footer,.nav-label,.nav-divider{display:none}.nav a{justify-content:center}.nav a span:not(.nav-icon){display:none}.content{padding:22px}.line{grid-template-columns:82px 66px minmax(0,1fr)}.module{display:none}}@media(max-width:620px){.app{display:block}.rail{display:none}.topbar{padding:0 16px}.mobile-menu{display:inline-grid;place-items:center;width:40px;height:40px;border:1px solid var(--border);border-radius:7px;background:var(--surface2);color:var(--text);margin-right:9px}.crumb{display:flex;align-items:center}.page-head{display:block}.actions{margin-top:14px}.actions>*{flex:1}.content{padding:16px 14px}.toolbar>*{flex:1}.line{grid-template-columns:72px 58px minmax(0,1fr);gap:7px;padding:8px}.console{max-height:none;min-height:440px}.footer{display:block}}@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.001ms!important;transition:none!important}}
</style></head><body><div class="app"><aside class="rail" data-ds-section="导航栏" aria-label="OllamaHub 主导航"><a class="brand" href="../overview/index.html"><span class="brand-mark">+</span><span class="brand-copy"><span class="brand-name">Ollama<span>Hub</span></span><small>控制中心</small></span></a><nav class="nav"><a href="../overview/index.html"><span class="nav-icon">◉</span><span>概览</span></a><a href="../gateway/index.html"><span class="nav-icon">▦</span><span>网关</span></a><a href="../providers/index.html"><span class="nav-icon">⇄</span><span>Provider</span></a><a href="../activity/index.html"><span class="nav-icon">≋</span><span>活动</span></a><span class="nav-divider"></span><span class="nav-label">运维</span><a href="../console/index.html" aria-current="page" data-prototype-target="控制台"><span class="nav-icon">⌘</span><span>控制台</span></a></nav><div class="rail-footer">服务版本<br><strong>v0.12.6 · 正在运行</strong></div></aside><main class="main"><header class="topbar" data-ds-section="状态栏"><div class="crumb"><button id="menuBtn" class="mobile-menu">☰</button><span>OllamaHub / </span><strong>控制台</strong></div><div class="stream-state"><span class="dot"></span><span id="streamLabel">日志流实时更新</span></div></header><div class="content"><section class="page-head" data-ds-section="页面标题"><div><h1>控制台</h1><p>查看本地网关、协议转换与上游请求的脱敏运行日志。</p></div><div class="actions"><button class="ghost" id="pauseBtn">暂停日志</button><button class="ghost" id="clearBtn">清空当前视图</button></div></section><section data-ds-section="日志筛选"><div class="toolbar"><select id="level"><option value="all">全部等级</option><option value="info">Info</option><option value="warn">Warning</option><option value="error">Error</option></select><select id="module"><option value="all">全部模块</option><option value="gateway">Gateway</option><option value="proxy">Proxy</option><option value="config">Config</option></select><input id="search" type="search" placeholder="搜索 request ID、模型或错误信息" aria-label="搜索控制台日志"><label class="check"><input id="autoScroll" type="checkbox" checked> 自动滚动</label></div><div class="console" id="console" role="log" aria-live="polite"></div><div class="footer"><span id="count">显示 8 条脱敏日志</span><span>日志文件：OllamaHub.log · API key 已自动隐藏</span></div></section></div></main></div><div class="toast" id="toast" role="status" aria-live="polite"></div>
<script>
const logs=[['10:42:18','info','gateway','OllamaHub listening on http://127.0.0.1:11434'],['10:42:21','ok','config','Loaded 3 providers and 6 exposed models from settings.json'],['10:43:04','info','proxy','req_7d91a2e4 · Claude Sonnet 4.5 · OpenAI → Anthropic · 842ms'],['10:43:17','warn','proxy','req_7d8e72d0 · GLM 5.1 · upstream returned 429 · retry-after 8s'],['10:43:26','info','gateway','GET /api/tags · 200 · returned 6 models'],['10:44:02','error','proxy','req_7d90f8bc · DeepSeek V4 Pro · upstream timeout after 30.0s'],['10:44:09','info','proxy','request headers sanitized · authorization: [redacted]'],['10:44:31','ok','gateway','POST /v1/chat/completions · 200 · finish_reason=end_turn']];let paused=false,timer;const box=document.getElementById('console'),toast=document.getElementById('toast');function notice(t){toast.textContent=t;toast.classList.add('show');clearTimeout(timer);timer=setTimeout(()=>toast.classList.remove('show'),2200)}function render(){const q=document.getElementById('search').value.toLowerCase(),lv=document.getElementById('level').value,mod=document.getElementById('module').value;const out=logs.filter(x=>(lv==='all'||x[1]===lv||(lv==='info'&&x[1]==='ok'))&&(mod==='all'||x[2]===mod)&&x.join(' ').toLowerCase().includes(q));box.innerHTML=out.length?out.map(x=>`<div class="line"><span class="time">${x[0]}</span><span class="level ${x[1]}">${x[1].toUpperCase()}</span><span class="module">${x[2]}</span><span class="message">${x[3].replace('[redacted]','<span class="redacted">[redacted]</span>')}</span></div>`).join(''):'<div class="empty">没有匹配当前筛选条件的日志。</div>';document.getElementById('count').textContent=`显示 ${out.length} 条脱敏日志`;if(document.getElementById('autoScroll').checked)box.scrollTop=box.scrollHeight}['search','level','module'].forEach(id=>document.getElementById(id).addEventListener('input',render));document.getElementById('autoScroll').onchange=render;document.getElementById('pauseBtn').onclick=e=>{paused=!paused;e.currentTarget.textContent=paused?'继续日志':'暂停日志';document.getElementById('streamLabel').textContent=paused?'日志流已暂停':'日志流实时更新';notice(paused?'控制台日志已暂停。':'控制台日志已继续。')};document.getElementById('clearBtn').onclick=()=>{logs.length=0;render();notice('当前控制台视图已清空，日志文件未删除。')};document.getElementById('menuBtn').onclick=()=>notice('移动端导航：概览、网关、Provider、活动、控制台');render();
</script></body></html>
