<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>OllamaHub Control Center — Gateway Routes</title><style>
:root{color-scheme:dark;font-family:"Segoe UI",system-ui,sans-serif;--bg:#0e141b;--surface:#151d26;--surface2:#1d2833;--surface3:#24323e;--border:#2c3945;--text:#dce7ee;--muted:#9bafbc;--accent:#16b8c4;--info:#6da1ff;--ok:#35c98a;--warn:#f0b44d;--danger:#f47f84;--shadow:0 16px 42px rgba(0,0,0,.2)}*{box-sizing:border-box}html,body{margin:0;width:100%;min-height:100%;background:var(--bg);color:var(--text)}body{line-height:1.55}a,button,select{font:inherit}a{color:inherit;text-decoration:none}button{cursor:pointer}a:focus-visible,button:focus-visible,select:focus-visible{outline:3px solid var(--accent);outline-offset:3px}.app{min-height:100vh;display:grid;grid-template-columns:240px minmax(0,1fr)}.rail{border-right:1px solid var(--border);padding:24px 16px;display:flex;flex-direction:column;gap:28px;background:rgba(21,29,38,.94)}.brand{display:flex;align-items:center;gap:11px;padding:0 10px}.brand-mark{width:34px;height:34px;border:2px solid var(--accent);border-radius:10px;display:grid;place-items:center;color:var(--accent);font-weight:800}.brand-name{font-weight:700}.brand-name span{color:var(--accent)}.brand small{display:block;color:var(--muted);font-size:10px}.nav{display:grid;gap:6px}.nav a{min-height:44px;padding:10px 12px;border-radius:8px;color:var(--muted);display:flex;align-items:center;gap:11px;font-size:14px}.nav a:hover,.nav a[aria-current=page]{color:var(--text);background:var(--surface3)}.nav a[aria-current=page]{box-shadow:inset 3px 0 var(--accent)}.nav-icon{width:20px;text-align:center;color:var(--accent);font-weight:700}.nav-divider{height:1px;background:var(--border);margin:4px 10px}.nav-label{padding:4px 12px;color:var(--muted);font-size:10px;letter-spacing:.12em;text-transform:uppercase}.rail-footer{margin-top:auto;border-top:1px solid var(--border);padding:18px 10px;color:var(--muted);font-size:12px}.rail-footer strong{color:var(--ok)}.main{min-width:0}.topbar{min-height:68px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;gap:16px;padding:0 clamp(18px,3vw,34px);background:rgba(21,29,38,.74);backdrop-filter:blur(16px)}.crumb{color:var(--muted);font-size:13px}.crumb strong{color:var(--text)}.service-pill{display:flex;align-items:center;gap:8px;border:1px solid rgba(53,201,138,.4);background:rgba(53,201,138,.09);color:var(--ok);padding:7px 11px;border-radius:999px;font-size:12px}.dot{width:7px;height:7px;border-radius:50%;background:currentColor}.mobile-menu{display:none}.content{max-width:1500px;margin:auto;padding:clamp(20px,3vw,34px)}.page-head{margin-bottom:16px}.page-head h1{font-size:clamp(25px,3vw,32px);line-height:1.15;letter-spacing:0;margin:0 0 5px}.page-head p{margin:0;color:var(--muted);font-size:14px}.head-actions{display:flex;gap:10px;flex-wrap:wrap}.ghost,.primary,.danger-btn{min-height:40px;padding:8px 13px;border:1px solid var(--border);border-radius:7px;background:var(--surface2);color:var(--text)}.ghost:hover{border-color:var(--accent);background:var(--surface3)}.primary{border-color:var(--accent);background:var(--accent);color:var(--bg);font-weight:700}.summary{display:flex;gap:16px;align-items:center;margin-bottom:14px;padding:10px 14px;border:1px solid var(--border);border-radius:8px;background:var(--surface);color:var(--muted);font-size:12px;flex-wrap:wrap}.summary strong{color:var(--text)}.summary .healthy{color:var(--ok)}.gateway-workspace{display:grid;grid-template-columns:minmax(280px,.34fr) minmax(0,.66fr);gap:14px;align-items:stretch}.endpoint-group{display:grid;grid-template-rows:repeat(3,1fr);gap:9px;min-height:456px}.endpoint-card{position:relative;width:100%;min-height:0;padding:14px;border:1px solid var(--border);border-radius:8px;background:rgba(29,40,51,.66);color:var(--text);text-align:left}.endpoint-card:hover,.endpoint-card[aria-selected=true]{border-color:var(--accent);background:rgba(22,184,196,.08)}.endpoint-card[aria-selected=true]{box-shadow:inset 3px 0 var(--accent)}.endpoint-card[aria-selected=true]:after{content:"";position:absolute;right:-15px;top:50%;width:15px;height:2px;background:var(--accent)}.card-head{display:flex;align-items:center;justify-content:space-between;gap:10px}.card-head h2{margin:0;font-size:17px}.endpoint-card p{margin:7px 0;color:var(--muted);font-size:12px}.url{display:block;min-height:40px;padding:9px;border:1px solid var(--border);border-radius:7px;background:var(--bg);color:#cfe0e8;font:11px/1.4 ui-monospace,Consolas,monospace;overflow-wrap:anywhere;cursor:copy}.url:hover{border-color:var(--accent);color:var(--text)}.switch{position:relative;width:44px;height:26px;min-width:44px;border:0;border-radius:999px;background:#3a4b57;padding:0}.switch:after{content:"";position:absolute;width:20px;height:20px;left:3px;top:3px;border-radius:50%;background:var(--text);transition:transform .16s ease-out}.switch[aria-checked=true]{background:var(--accent)}.switch[aria-checked=true]:after{transform:translateX(18px);background:var(--bg)}.models-panel{min-height:456px;border:1px solid var(--accent);border-radius:8px;background:rgba(29,40,51,.72);box-shadow:var(--shadow);display:flex;flex-direction:column;overflow:hidden}.models-head{padding:14px 16px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;gap:12px;background:rgba(22,184,196,.05)}.models-head h2{margin:0;font-size:17px}.models-head p{margin:3px 0 0;color:#b4c5cf;font-size:11px}.head-tools{display:flex;align-items:center}.add-btn{position:relative;width:40px;height:40px;border:1px solid var(--border);border-radius:7px;background:transparent;color:var(--accent);padding:0;font-size:24px;line-height:1}.add-btn:hover{border-color:var(--accent);background:rgba(22,184,196,.08)}.add-btn:after{content:attr(data-tip);position:absolute;right:0;bottom:calc(100% + 8px);width:max-content;max-width:190px;padding:6px 9px;border:1px solid var(--border);border-radius:6px;background:var(--bg);color:var(--text);font-size:11px;line-height:1.4;box-shadow:var(--shadow);opacity:0;pointer-events:none;transform:translateY(4px);transition:.16s ease-out}.add-btn:hover:after,.add-btn:focus-visible:after{opacity:1;transform:none}.add-bar{display:none;grid-template-columns:minmax(0,1fr) auto auto;gap:8px;padding:10px 12px;border-bottom:1px solid var(--border);background:var(--surface)}.add-bar.show{display:grid}.add-bar select{min-height:40px;border:1px solid var(--border);border-radius:7px;background:var(--bg);color:var(--text);padding:7px}.route-list{display:grid;padding:4px 12px;overflow:auto;flex:1;align-content:start}.route{display:grid;grid-template-columns:24px minmax(0,1fr) minmax(120px,.36fr) 44px 40px;align-items:center;gap:9px;min-height:62px;padding:8px;border-bottom:1px solid var(--border);cursor:grab}.route:hover{background:rgba(22,184,196,.05)}.route.dragging{opacity:.5}.route.disabled{opacity:.55}.handle{color:var(--muted);font-size:17px;letter-spacing:-5px}.model{min-width:0}.model strong{display:block;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.model span{display:block;color:var(--muted);font-size:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.provider{color:#c2d2ef;font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.remove{width:40px;height:40px;border:0;border-radius:7px;background:transparent;color:var(--danger);font-size:18px}.remove:hover{background:rgba(244,127,132,.1)}.empty{margin:auto;padding:40px 18px;text-align:center;color:var(--muted);font-size:12px}.empty strong{display:block;color:var(--text);font-size:14px;margin-bottom:4px}.toast{position:fixed;right:22px;bottom:22px;max-width:min(390px,calc(100vw - 32px));padding:12px 15px;border:1px solid rgba(53,201,138,.42);border-radius:8px;background:#18352f;color:var(--text);box-shadow:var(--shadow);opacity:0;transform:translateY(10px);pointer-events:none;transition:.18s ease-out}.toast.show{opacity:1;transform:none}@media(max-width:980px){.app{grid-template-columns:72px minmax(0,1fr)}.rail{padding:22px 10px}.brand{justify-content:center}.brand-copy,.rail-footer,.nav-label,.nav-divider{display:none}.nav a{justify-content:center}.nav a span:not(.nav-icon){display:none}.content{padding:22px}.gateway-workspace{grid-template-columns:1fr}.endpoint-group{grid-template-columns:repeat(3,minmax(0,1fr));grid-template-rows:1fr;min-height:0}.models-panel{min-height:390px}.endpoint-card[aria-selected=true]:after{display:none}}@media(max-width:680px){.app{display:block}.rail{display:none}.topbar{padding:0 16px}.mobile-menu{display:inline-grid;place-items:center;width:40px;height:40px;border:1px solid var(--border);border-radius:7px;background:var(--surface2);color:var(--text);margin-right:9px}.crumb{display:flex;align-items:center}.page-head{display:block}.head-actions{margin-top:14px}.head-actions>*{flex:1}.content{padding:16px 14px}.endpoint-group{grid-template-columns:1fr}.route{grid-template-columns:20px minmax(0,1fr) 44px 40px}.provider{grid-column:2}.models-head{align-items:flex-start}.add-bar{grid-template-columns:1fr}.service-pill{font-size:11px}}@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.001ms!important;transition:none!important}}
</style></head><body><div class="app"><aside class="rail" data-ds-section="导航栏" aria-label="OllamaHub 主导航"><a class="brand" href="../899ef30d/v2.html"><span class="brand-mark">+</span><span class="brand-copy"><span class="brand-name">Ollama<span>Hub</span></span><small>控制中心</small></span></a><nav class="nav"><a href="../899ef30d/v2.html"><span class="nav-icon">◉</span><span>概览</span></a><a href="./v3.html" aria-current="page"><span class="nav-icon">▦</span><span>网关</span></a><a href="../689f5fad/v1.html"><span class="nav-icon">⇄</span><span>Provider</span></a><a href="../de3c9aba/v2.html"><span class="nav-icon">≋</span><span>活动</span></a><span class="nav-divider"></span><span class="nav-label">运维</span><a href="./v3.html" data-prototype-target="控制台"><span class="nav-icon">⌘</span><span>控制台</span></a></nav><div class="rail-footer">服务版本<br><strong>v0.12.6 · 正在运行</strong></div></aside><main class="main"><header class="topbar" data-ds-section="状态栏"><div class="crumb"><button id="menuBtn" class="mobile-menu">☰</button><span>OllamaHub / </span><strong>网关</strong></div><div class="service-pill"><span class="dot"></span><span id="activeSummary">2 个 Endpoint 已启用</span></div></header><div class="content"><section class="page-head" data-ds-section="页面标题"><div><h1>网关路由编排</h1><p>先选择左侧 Endpoint，再维护它独立拥有的模型路由；所有修改实时保存。</p></div></section><section class="summary" data-ds-section="网关摘要"><span><strong>3</strong> 个 Endpoint</span><span><strong id="enabledRoutes">4</strong> 条启用路由</span><span class="healthy">更改实时保存</span></section><section class="gateway-workspace" data-ds-section="Endpoint 与模型"><div class="endpoint-group" role="tablist" aria-label="Endpoint 配置选择"><button class="endpoint-card" role="tab" aria-selected="true" data-endpoint="openai"><span class="card-head"><h2>OpenAI</h2><span class="switch endpoint-switch" role="switch" aria-checked="true" aria-label="启用 OpenAI Endpoint"></span></span><p>OpenAI Chat Completions 兼容入口</p><span class="url" role="button" tabindex="0" data-url="http://127.0.0.1:11434/v1">http://127.0.0.1:11434/v1</span></button><button class="endpoint-card" role="tab" aria-selected="false" data-endpoint="ollama"><span class="card-head"><h2>Ollama</h2><span class="switch endpoint-switch" role="switch" aria-checked="true" aria-label="启用 Ollama Endpoint"></span></span><p>Ollama 原生 API 与本地工具入口</p><span class="url" role="button" tabindex="0" data-url="http://127.0.0.1:11434/api">http://127.0.0.1:11434/api</span></button><button class="endpoint-card" role="tab" aria-selected="false" data-endpoint="azure"><span class="card-head"><h2>Azure</h2><span class="switch endpoint-switch" role="switch" aria-checked="false" aria-label="启用 Azure Endpoint"></span></span><p>Microsoft Azure OpenAI 兼容入口</p><span class="url" role="button" tabindex="0" data-url="http://127.0.0.1:11434/azure/v1">http://127.0.0.1:11434/azure/v1</span></button></div><section class="models-panel" aria-labelledby="modelsTitle"><header class="models-head"><div><h2 id="modelsTitle">OpenAI 的模型路由</h2><p id="modelsMeta">仅影响 OpenAI Endpoint · 拖动调整优先级</p></div><div class="head-tools"><button class="add-btn" id="addBtn" aria-label="向当前 Endpoint 新增模型" data-tip="向当前选中的 Endpoint 新增模型">+</button></div></header><div class="add-bar" id="addBar"><select id="modelPicker" aria-label="选择要添加的模型"><option value="">选择 Provider / Model…</option><option>Anthropic 官方 / Claude 3.7 Sonnet</option><option>智脑 / GLM 5.1</option><option>本地 Ollama / Qwen3 32B</option></select><button class="primary" id="confirmAdd">添加到当前 Endpoint</button><button class="ghost" id="cancelAdd">取消</button></div><div class="route-list" id="routeList"></div></section></section></div></main></div><div class="toast" id="toast" role="status" aria-live="polite"></div>
<script>
const data={openai:[['Claude Sonnet 4.5','上下文 200K · 优先级 1','智脑 / Anthropic',true],['DeepSeek V4 Pro','上下文 1M · 优先级 2','智脑 / OpenAI',true],['GPT-4.1','上下文 128K · 优先级 3','OpenAI 官方',false]],ollama:[['Qwen3 32B','上下文 32K · 优先级 1','本地 Ollama',true],['GLM 5.1','上下文 200K · 优先级 2','智脑 / OpenAI',true]],azure:[]};const names={openai:'OpenAI',ollama:'Ollama',azure:'Azure'};let active='openai',dragged=null,timer;const list=document.getElementById('routeList'),toast=document.getElementById('toast');function notice(t){toast.textContent=t;toast.classList.add('show');clearTimeout(timer);timer=setTimeout(()=>toast.classList.remove('show'),2200)}function refreshPriorities(){data[active].forEach((r,i)=>r[1]=r[1].replace(/优先级 \d+/,`优先级 ${i+1}`))}function render(){refreshPriorities();const rows=data[active],name=names[active];document.getElementById('modelsTitle').textContent=`${name} 的模型路由`;document.getElementById('modelsMeta').textContent=`仅影响 ${name} Endpoint · ${rows.length?`${rows.length} 条路由，拖动调整优先级`:'尚未配置路由'}`;list.innerHTML=rows.length?rows.map((r,i)=>`<div class="route ${r[3]?'':'disabled'}" draggable="true" data-index="${i}"><span class="handle">⋮⋮</span><div class="model"><strong>${r[0]}</strong><span>${r[1]}</span></div><span class="provider">${r[2]}</span><button class="switch route-switch" role="switch" aria-checked="${r[3]}" aria-label="启用 ${r[0]}"></button><button class="remove" aria-label="从 ${name} 删除 ${r[0]}" title="删除模型">×</button></div>`).join(''):`<div class="empty"><strong>${name} 尚未绑定模型</strong>点击右上角“新增模型”，只为当前 Endpoint 添加路由。</div>`;wireRows();updateCounts()}function updateCounts(){document.getElementById('enabledRoutes').textContent=Object.values(data).flat().filter(x=>x[3]).length;document.getElementById('activeSummary').textContent=`${[...document.querySelectorAll('.endpoint-switch')].filter(x=>x.getAttribute('aria-checked')==='true').length} 个 Endpoint 已启用`}function wireRows(){document.querySelectorAll('.route-switch').forEach(sw=>sw.onclick=e=>{const i=+e.currentTarget.closest('.route').dataset.index;data[active][i][3]=!data[active][i][3];const model=data[active][i][0];render();notice(`${model} 已${data[active][i][3]?'启用':'停用'}，更改已保存。`)});document.querySelectorAll('.remove').forEach(btn=>btn.onclick=e=>{const i=+e.currentTarget.closest('.route').dataset.index,model=data[active][i][0];data[active].splice(i,1);render();notice(`${model} 已从 ${names[active]} Endpoint 删除，更改已保存。`)});document.querySelectorAll('.route').forEach(row=>{row.ondragstart=()=>{dragged=+row.dataset.index;row.classList.add('dragging')};row.ondragend=()=>row.classList.remove('dragging');row.ondragover=e=>{e.preventDefault();const to=+row.dataset.index;if(dragged!==null&&dragged!==to){const [m]=data[active].splice(dragged,1);data[active].splice(to,0,m);dragged=to;render()}}})}document.querySelectorAll('.endpoint-card').forEach(card=>card.onclick=e=>{if(e.target.closest('.endpoint-switch')||e.target.closest('.url'))return;active=card.dataset.endpoint;document.querySelectorAll('.endpoint-card').forEach(c=>c.setAttribute('aria-selected',String(c===card)));document.getElementById('addBar').classList.remove('show');render();notice(`正在查看 ${names[active]} Endpoint 的模型。`)});document.querySelectorAll('.endpoint-switch').forEach(sw=>sw.onclick=e=>{e.stopPropagation();const on=sw.getAttribute('aria-checked')==='true';sw.setAttribute('aria-checked',String(!on));updateCounts();notice(`${sw.getAttribute('aria-label').replace('启用 ','')} 已${on?'停用':'启用'}，更改已保存。`)});document.querySelectorAll('.url').forEach(u=>{const copy=async()=>{try{await navigator.clipboard.writeText(u.dataset.url);notice(`${u.dataset.url} 已复制。`)}catch(e){notice(`Endpoint：${u.dataset.url}`)}};u.onclick=e=>{e.stopPropagation();copy()};u.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();copy()}}});document.getElementById('addBtn').onclick=()=>document.getElementById('addBar').classList.add('show');document.getElementById('cancelAdd').onclick=()=>document.getElementById('addBar').classList.remove('show');document.getElementById('confirmAdd').onclick=()=>{const v=document.getElementById('modelPicker').value;if(!v){notice('请先选择 Provider / Model。');return}const [provider,model]=v.split(' / ');data[active].push([model,'上下文 128K · 优先级 1',provider,true]);document.getElementById('modelPicker').value='';document.getElementById('addBar').classList.remove('show');render();notice(`${model} 已添加到 ${names[active]} Endpoint，更改已保存。`)};document.getElementById('menuBtn').onclick=()=>notice('移动端导航：概览、网关、Provider、活动、控制台');render();
</script></body></html>
