<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>OllamaHub Logo Showcase</title>
  <style>
    :root { color-scheme: dark; font-family: Inter, "Segoe UI", system-ui, sans-serif; background: #0e141b; color: #dce7ee; }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body { min-height: 100vh; display: grid; place-items: center; overflow-x: hidden; background: #0e141b; }
    main { width: min(100%, 980px); padding: 32px 24px 40px; }
    .tile { min-height: 680px; padding: clamp(32px, 7vw, 82px) clamp(22px, 7vw, 78px); border: 1px solid #2c3945; border-radius: 18px; background: #151d26; box-shadow: 0 28px 80px rgba(0,0,0,.28); display: grid; align-content: center; justify-items: center; gap: 42px; position: relative; overflow: hidden; }
    .tile::before { content: ""; position: absolute; inset: 22px; border: 1px solid rgba(22,184,196,.12); border-radius: 12px; pointer-events: none; }
    .eyebrow { position: relative; margin: 0; color: #91a4b2; font-size: 11px; letter-spacing: .18em; text-transform: uppercase; }
    .primary { position: relative; display: flex; align-items: center; gap: 24px; color: #dce7ee; }
    .primary svg { width: clamp(88px, 15vw, 144px); height: auto; flex: none; }
    .wordmark { font-size: clamp(38px, 7vw, 76px); line-height: .95; letter-spacing: -.035em; font-weight: 650; }
    .wordmark span { color: #16b8c4; }
    .tagline { margin: -24px 0 0; color: #91a4b2; font: 14px/1.6 ui-monospace, SFMono-Regular, Consolas, monospace; }
    .variants { width: min(100%, 560px); display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    .variant { min-height: 132px; padding: 20px; border: 1px solid #2c3945; border-radius: 10px; background: rgba(29,40,51,.78); display: grid; align-content: center; gap: 14px; }
    .variant-label { margin: 0; color: #91a4b2; font-size: 11px; letter-spacing: .12em; text-transform: uppercase; }
    .lockup { display: flex; align-items: center; gap: 10px; color: #dce7ee; font-size: 22px; font-weight: 650; letter-spacing: -.025em; }
    .lockup svg { width: 34px; height: 34px; }
    .mono { color: #dce7ee; }
    .mono svg { color: currentColor; }
    .mono .variant-label { color: #91a4b2; }
    @media (max-width: 620px) { main { padding: 12px; } .tile { min-height: 620px; gap: 30px; padding: 42px 20px; } .primary { flex-direction: column; gap: 18px; text-align: center; } .variants { grid-template-columns: 1fr; } .tagline { margin: -12px 0 0; text-align: center; } }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .001ms !important; transition-duration: .001ms !important; } }
  </style>
</head>
<body>
  <main>
    <section class="tile" aria-label="OllamaHub logo showcase">
      <p class="eyebrow">Local gateway / cross-platform</p>
      <div class="primary" aria-label="OllamaHub primary logo">
        <svg viewBox="0 0 160 160" role="img" aria-labelledby="mark-title mark-desc">
          <title id="mark-title">OllamaHub hub bridge mark</title>
          <desc id="mark-desc">A central gateway node connected to three protocol nodes.</desc>
          <g fill="none" stroke="#16b8c4" stroke-linecap="round" stroke-linejoin="round">
            <path d="M80 80 33 38M80 80l47-42M80 80v51" stroke-width="11"/>
            <path d="M80 80 33 38M80 80l47-42M80 80v51" stroke="#dce7ee" stroke-width="3" opacity=".7"/>
          </g>
          <circle cx="33" cy="38" r="16" fill="#151d26" stroke="#16b8c4" stroke-width="8"/>
          <circle cx="127" cy="38" r="16" fill="#151d26" stroke="#16b8c4" stroke-width="8"/>
          <circle cx="80" cy="131" r="16" fill="#151d26" stroke="#16b8c4" stroke-width="8"/>
          <rect x="49" y="49" width="62" height="62" rx="18" fill="#16b8c4"/>
          <path d="M63 79h34M80 62v34" stroke="#0e141b" stroke-width="9" stroke-linecap="round"/>
        </svg>
        <div class="wordmark">Ollama<span>Hub</span></div>
      </div>
      <p class="tagline">one local endpoint / many model protocols</p>
      <div class="variants">
        <div class="variant">
          <p class="variant-label">Compact lockup</p>
          <div class="lockup">
            <svg viewBox="0 0 160 160" aria-hidden="true">
              <path d="M80 80 33 38M80 80l47-42M80 80v51" fill="none" stroke="#16b8c4" stroke-width="11" stroke-linecap="round"/>
              <circle cx="33" cy="38" r="16" fill="#1d2833" stroke="#16b8c4" stroke-width="8"/>
              <circle cx="127" cy="38" r="16" fill="#1d2833" stroke="#16b8c4" stroke-width="8"/>
              <circle cx="80" cy="131" r="16" fill="#1d2833" stroke="#16b8c4" stroke-width="8"/>
              <rect x="49" y="49" width="62" height="62" rx="18" fill="#16b8c4"/>
              <path d="M63 79h34M80 62v34" stroke="#0e141b" stroke-width="9" stroke-linecap="round"/>
            </svg>
            <span>OllamaHub</span>
          </div>
        </div>
        <div class="variant mono">
          <p class="variant-label">Monochrome / one color</p>
          <div class="lockup">
            <svg viewBox="0 0 160 160" aria-hidden="true">
              <path d="M80 80 33 38M80 80l47-42M80 80v51" fill="none" stroke="currentColor" stroke-width="11" stroke-linecap="round"/>
              <circle cx="33" cy="38" r="16" fill="#1d2833" stroke="currentColor" stroke-width="8"/>
              <circle cx="127" cy="38" r="16" fill="#1d2833" stroke="currentColor" stroke-width="8"/>
              <circle cx="80" cy="131" r="16" fill="#1d2833" stroke="currentColor" stroke-width="8"/>
              <rect x="49" y="49" width="62" height="62" rx="18" fill="currentColor"/>
              <path d="M63 79h34M80 62v34" stroke="#151d26" stroke-width="9" stroke-linecap="round"/>
            </svg>
            <span>OllamaHub</span>
          </div>
        </div>
      </div>
    </section>
  </main>
</body>
</html>
