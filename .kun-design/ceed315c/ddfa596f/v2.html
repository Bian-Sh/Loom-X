<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>OllamaHub Logo Showcase — Bridge Mark</title>
<style>
:root{color-scheme:dark;font-family:"Segoe UI",system-ui,sans-serif;--bg:#0e141b;--surface:#151d26;--surface2:#1d2833;--border:#2c3945;--text:#dce7ee;--muted:#91a4b2;--accent:#16b8c4;--blue:#4d8dff}
*{box-sizing:border-box}html,body{margin:0;width:100%;min-height:100%;background:var(--bg);color:var(--text)}body{display:grid;place-items:center}a,button{font:inherit}a{color:inherit;text-decoration:none}a:focus-visible,button:focus-visible{outline:3px solid var(--accent);outline-offset:3px}main{width:min(100%,1280px);padding:20px}.tile{min-height:557px;padding:32px clamp(22px,7vw,78px);border:1px solid var(--border);border-radius:12px;background:var(--surface);box-shadow:0 28px 80px rgba(0,0,0,.28);display:grid;align-content:center;justify-items:center;gap:24px;position:relative;overflow:hidden}.tile:before{content:"";position:absolute;inset:20px;border:1px solid rgba(22,184,196,.14);border-radius:8px;pointer-events:none}.eyebrow,.tagline,.variant-label{position:relative;margin:0;color:var(--muted)}.eyebrow{font-size:11px;letter-spacing:.16em;text-transform:uppercase}.primary{position:relative;display:flex;align-items:center;gap:22px}.primary svg{width:clamp(78px,11vw,118px);height:auto}.wordmark{font-size:clamp(36px,5vw,62px);line-height:1;font-weight:650;letter-spacing:0}.wordmark span{color:var(--accent)}.tagline{margin-top:-5px;font:13px/1.5 ui-monospace,SFMono-Regular,Consolas,monospace}.variants{position:relative;width:min(100%,560px);display:grid;grid-template-columns:1fr 1fr;gap:14px}.variant{min-height:112px;padding:16px;border:1px solid var(--border);border-radius:8px;background:rgba(29,40,51,.78);display:grid;align-content:center;gap:10px}.variant-label{font-size:10px;letter-spacing:.1em;text-transform:uppercase}.lockup{display:flex;align-items:center;gap:10px;font-size:20px;font-weight:650}.lockup svg{width:34px;height:34px}.mono{color:var(--text)}.mono svg{color:currentColor}@media(max-width:620px){main{padding:10px}.tile{min-height:577px;padding:34px 18px;gap:20px}.primary{flex-direction:column;gap:14px;text-align:center}.variants{grid-template-columns:1fr}.tagline{text-align:center}.variant{min-height:96px}}@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<main><section class="tile" data-ds-section="品牌标志" aria-label="OllamaHub 品牌标志展示">
<p class="eyebrow">Local gateway / protocol bridge</p>
<div class="primary" aria-label="OllamaHub 主标志">
<svg viewBox="0 0 180 120" role="img" aria-labelledby="mark-title mark-desc"><title id="mark-title">OllamaHub protocol bridge mark</title><desc id="mark-desc">An angular bridge core linking two protocol ports with an upstream and downstream line.</desc><g fill="none" stroke="var(--accent)" stroke-linecap="round" stroke-linejoin="round"><path d="M18 60h36M126 60h36M90 16v20M90 84v20" stroke-width="10"/><path d="M18 60h36M126 60h36M90 16v20M90 84v20" stroke="var(--blue)" stroke-width="3"/></g><rect x="54" y="30" width="72" height="60" rx="12" fill="var(--accent)"/><path d="M72 60h36M90 44v32" stroke="var(--bg)" stroke-width="9" stroke-linecap="square"/><rect x="7" y="49" width="22" height="22" rx="4" fill="var(--surface2)" stroke="var(--accent)" stroke-width="6"/><rect x="151" y="49" width="22" height="22" rx="4" fill="var(--surface2)" stroke="var(--accent)" stroke-width="6"/><rect x="80" y="6" width="20" height="20" rx="4" fill="var(--surface2)" stroke="var(--accent)" stroke-width="6"/><rect x="80" y="94" width="20" height="20" rx="4" fill="var(--surface2)" stroke="var(--accent)" stroke-width="6"/></svg><div class="wordmark">Ollama<span>Hub</span></div>
</div><p class="tagline">one local endpoint / many model protocols</p>
<div class="variants" data-ds-section="标志变体"><div class="variant"><p class="variant-label">Compact lockup</p><div class="lockup"><svg viewBox="0 0 180 120" aria-hidden="true"><path d="M18 60h36M126 60h36M90 16v20M90 84v20" fill="none" stroke="var(--accent)" stroke-width="10" stroke-linecap="round"/><rect x="54" y="30" width="72" height="60" rx="12" fill="var(--accent)"/><path d="M72 60h36M90 44v32" stroke="var(--bg)" stroke-width="9" stroke-linecap="square"/><rect x="7" y="49" width="22" height="22" rx="4" fill="var(--surface2)" stroke="var(--accent)" stroke-width="6"/><rect x="151" y="49" width="22" height="22" rx="4" fill="var(--surface2)" stroke="var(--accent)" stroke-width="6"/></svg><span>OllamaHub</span></div></div><div class="variant mono"><p class="variant-label">Monochrome / one color</p><div class="lockup"><svg viewBox="0 0 180 120" aria-hidden="true"><path d="M18 60h36M126 60h36M90 16v20M90 84v20" fill="none" stroke="currentColor" stroke-width="10" stroke-linecap="round"/><rect x="54" y="30" width="72" height="60" rx="12" fill="currentColor"/><path d="M72 60h36M90 44v32" stroke="var(--surface)" stroke-width="9" stroke-linecap="square"/><rect x="7" y="49" width="22" height="22" rx="4" fill="var(--surface2)" stroke="currentColor" stroke-width="6"/><rect x="151" y="49" width="22" height="22" rx="4" fill="var(--surface2)" stroke="currentColor" stroke-width="6"/></svg><span>OllamaHub</span></div></div></div>
</section></main></body></html>
