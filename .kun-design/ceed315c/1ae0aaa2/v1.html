<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Generating design preview</title>
  <style>
    :root {
      color-scheme: light;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f8f5ec;
      color: #263238;
    }
    * { box-sizing: border-box; }
    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      min-height: 0;
      overflow: hidden;
    }
    body {
      display: grid;
      place-items: center;
      background:
        radial-gradient(circle at 20% 20%, rgba(37, 99, 235, 0.12), transparent 34%),
        linear-gradient(135deg, #fffaf0 0%, #eef6ff 100%);
    }
    main {
      display: grid;
      gap: clamp(8px, 3vh, 14px);
      place-items: center;
      width: min(100%, 460px);
      max-height: 100%;
      overflow: hidden;
      padding: clamp(12px, 5vh, 32px) clamp(14px, 6vw, 32px);
      text-align: center;
    }
    .mark {
      width: 44px;
      height: 44px;
      border-radius: 18px;
      border: 1px solid rgba(37, 99, 235, 0.26);
      background: rgba(255, 255, 255, 0.72);
      box-shadow: 0 18px 48px rgba(31, 41, 55, 0.12);
      display: grid;
      place-items: center;
    }
    .pulse {
      width: 12px;
      height: 12px;
      border-radius: 999px;
      background: #2563eb;
      animation: pulse 1.1s ease-in-out infinite;
    }
    h1 {
      margin: 0;
      font-size: clamp(20px, 4vw, 36px);
      line-height: 1.1;
      font-weight: 760;
      letter-spacing: 0;
    }
    p {
      margin: 0;
      max-width: 460px;
      font-size: clamp(11px, 2.5vw, 14px);
      line-height: 1.6;
      color: #5f6b7a;
    }
    @media (max-height: 230px) {
      main {
        grid-template-columns: auto minmax(0, 1fr);
        padding: 12px;
        text-align: left;
      }
      .mark {
        width: 32px;
        height: 32px;
        border-radius: 12px;
      }
      .pulse {
        width: 9px;
        height: 9px;
      }
      h1 {
        font-size: 16px;
      }
      p {
        grid-column: 1 / -1;
        max-width: 100%;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        line-height: 1.35;
      }
    }
    @keyframes pulse {
      0%, 100% { transform: scale(0.82); opacity: 0.42; }
      50% { transform: scale(1); opacity: 1; }
    }

  </style>
</head>
<body>
  <main aria-live="polite">
    <div class="mark" aria-hidden="true"><div class="pulse"></div></div>
    <h1>Generating design...</h1>
    <p>Kun is preparing a live preview for <code>.kun-design/ceed315c/1ae0aaa2/v1.html</code>. The canvas will refresh as the HTML file changes.</p>
  </main>
</body>
</html>
