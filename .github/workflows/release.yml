name: LoomX CI 与发布

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: loomx-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: 构建与测试
    runs-on: windows-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v5

      - name: 安装 .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      - name: 恢复依赖
        run: dotnet restore LoomX.slnx

      - name: 构建
        run: dotnet build LoomX.slnx --configuration Release --no-restore

      - name: 测试
        run: dotnet test LoomX.Tests/LoomX.Tests.csproj --configuration Release --no-build --no-restore

  package:
    name: 生成 Inno Setup 安装包
    needs: verify
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v5

      - name: 安装 .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      - name: 计算版本
        id: version
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart("v")
          if ($version -notmatch "^\d+\.\d+\.\d+([-.].*)?$") {
            $version = "0.0.0-ci.${{ github.run_number }}"
          }
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: 发布桌面应用
        shell: pwsh
        run: |
          pwsh -File scripts/publish-desktop.ps1 `
            -Configuration Release `
            -OutputDirectory "artifacts/publish"

      - name: 安装 Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: 编译安装包并生成校验文件
        shell: pwsh
        env:
          LOOMX_VERSION: ${{ steps.version.outputs.version }}
        run: |
          $isccCandidates = @(
            "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe",
            "$env:ProgramFiles\Inno Setup 6\ISCC.exe"
          )
          $iscc = $isccCandidates | Where-Object { Test-Path -LiteralPath $_ } | Select-Object -First 1
          if (-not $iscc) { throw "找不到 Inno Setup 编译器 ISCC.exe" }

          New-Item -ItemType Directory -Force -Path "artifacts/installer" | Out-Null
          & $iscc `
            "/DAppVersion=$env:LOOMX_VERSION" `
            "/DSourceDir=$((Resolve-Path 'artifacts/publish').Path)" `
            "/DOutputDir=$((Resolve-Path 'artifacts/installer').Path)" `
            "installer/LoomX.iss"
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup 编译失败，退出码：$LASTEXITCODE" }

          $setup = Get-ChildItem "artifacts/installer" -Filter "*.exe" -File | Select-Object -First 1
          if (-not $setup) { throw "没有生成安装包" }
          Get-FileHash $setup.FullName -Algorithm SHA256 |
            Set-Content -LiteralPath "$($setup.FullName).sha256" -Encoding utf8

      - name: 上传安装包构建产物
        uses: actions/upload-artifact@v4
        with:
          name: loomx-installer
          path: artifacts/installer/*
          retention-days: 14

  release:
    name: 创建 GitHub Release
    needs: package
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: 下载安装包
        uses: actions/download-artifact@v4
        with:
          name: loomx-installer
          path: artifacts/installer

      - name: 发布 Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: artifacts/installer/*
