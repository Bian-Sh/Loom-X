<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
  html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#07131b;color:#dff7f8;font-family:Segoe UI,Microsoft YaHei,sans-serif}
  #scene{display:block;width:100%;height:100%;cursor:grab}
  #scene.dragging{cursor:grabbing}
  #hud{position:fixed;left:18px;top:16px;padding:12px 14px;border:1px solid #1c4652;border-radius:9px;background:#07151cdc;box-shadow:0 8px 24px #02080c66;pointer-events:none}
  #hud .label{font-size:10px;color:#8eabb2;letter-spacing:1.2px}#hud .value{font-size:24px;font-weight:700;color:#ecffff;margin:2px 0}#hud .meta{font-size:10px;color:#8eabb2}
  #legend{position:fixed;left:18px;bottom:16px;display:flex;gap:13px;padding:8px 10px;border:1px solid #1c4652;border-radius:8px;background:#07151cbf;font-size:10px;color:#91adb5;pointer-events:none}
  #legend i{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:5px}.ep{background:#43d7e9}.model{background:#f6c56b}.live{background:#39e2b0;box-shadow:0 0 8px #39e2b0}
  #tooltip{position:fixed;display:none;min-width:170px;padding:10px 12px;border-left:2px solid #43d7e9;border-radius:7px;background:#07151cf2;box-shadow:0 10px 26px #02080caa;font-size:11px;pointer-events:none}
  #tooltip b{font-size:13px;color:#ecffff}#tooltip small{display:block;color:#8eabb2;margin-top:3px}#tooltip .stat{display:flex;justify-content:space-between;margin-top:8px;color:#91adb5}#tooltip .stat span:last-child{color:#e1f8f8}
  #empty{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;color:#7f9ea7;font-size:12px;pointer-events:none}
</style>
</head>
<body>
<canvas id="scene"></canvas>
<div id="hud"><div class="label">LIVE TOPOLOGY</div><div class="value" id="active">0</div><div class="meta" id="rate">等待网关事件</div></div>
<div id="legend"><span><i class="ep"></i>Endpoint</span><span><i class="model"></i>Model</span><span><i class="live"></i>活跃边</span></div>
<div id="tooltip"></div><div id="empty">等待拓扑快照…</div>
<script>
window.__overviewState={moduleLoaded:false,rendererReady:false,topologyApplied:0,telemetryReceived:0,lastError:null,lastTopology:null};
window.__overviewQueue={topologies:[],telemetry:[]};
window.__overviewPostHost=message=>{try{if(typeof invokeCSharpAction==='function')invokeCSharpAction(message)}catch(_){}};
window.__overviewDiagnostics=()=>({...window.__overviewState,queuedTopologies:window.__overviewQueue.topologies.length,queuedTelemetry:window.__overviewQueue.telemetry.length});
window.addEventListener('error',event=>{window.__overviewState.lastError=event.message||'script-error';window.__overviewPostHost('graph-error:'+String(window.__overviewState.lastError).slice(0,240))});
window.addEventListener('unhandledrejection',event=>{const reason=event.reason?.message||String(event.reason||'promise-rejection');window.__overviewState.lastError=reason;window.__overviewPostHost('graph-error:'+reason.slice(0,240))});
window.applyTopology=json=>window.__overviewQueue.topologies.push(json);
window.receiveTelemetry=eventData=>window.__overviewQueue.telemetry.push(eventData);
</script>
<script type="module">
import * as THREE from './three.module.min.js';
window.__overviewState.moduleLoaded=true;

const canvas=document.getElementById('scene'), renderer=new THREE.WebGLRenderer({canvas,antialias:true,alpha:false});
window.__overviewState.rendererReady=true;
renderer.setPixelRatio(Math.min(devicePixelRatio,2)); renderer.setClearColor(0x07131b,1);
const scene=new THREE.Scene(); scene.fog=new THREE.Fog(0x07131b,12,35);
const camera=new THREE.PerspectiveCamera(42,1,.1,100); camera.position.set(0,2.8,19);
const world=new THREE.Group(); world.rotation.x=-.08; scene.add(world);
scene.add(new THREE.AmbientLight(0x8bd4d8,.55)); const keyLight=new THREE.PointLight(0x51d7e5,2.2,24); keyLight.position.set(-4,7,8); scene.add(keyLight);
const grid=new THREE.GridHelper(24,24,0x1d5661,0x12343d); grid.position.y=-3.7; grid.material.transparent=true; grid.material.opacity=.34; world.add(grid);
const raycaster=new THREE.Raycaster(), pointer=new THREE.Vector2(), nodeObjects=[], nodeMap=new Map(), edgeMap=new Map(), requestEdges=new Map(), activeRequests=new Set();
let topology=null, dragging=false, lastX=0,lastY=0, yaw=0,pitch=-.08;

function resize(){const w=canvas.clientWidth||1,h=canvas.clientHeight||1; renderer.setSize(w,h,false); camera.aspect=w/h; camera.updateProjectionMatrix()} window.addEventListener('resize',resize); resize();
function labelSprite(text,color='#dff7f8',scale=1){const c=document.createElement('canvas');c.width=512;c.height=96;const x=c.getContext('2d');x.font='600 28px Segoe UI,Microsoft YaHei';x.fillStyle=color;x.fillText(text,14,56);const t=new THREE.CanvasTexture(c);t.minFilter=THREE.LinearFilter;const s=new THREE.Sprite(new THREE.SpriteMaterial({map:t,transparent:true,depthTest:false}));s.scale.set(2.6*scale,.49*scale,1);return s}
function sphere(pos,color,size,type,data){const g=new THREE.SphereGeometry(size,24,18),m=new THREE.MeshStandardMaterial({color,emissive:color,emissiveIntensity:.38,metalness:.35,roughness:.35});const o=new THREE.Mesh(g,m);o.position.copy(pos);o.userData={type,...data,baseColor:color};world.add(o);nodeObjects.push(o);const ring=new THREE.Mesh(new THREE.TorusGeometry(size*1.3,size*.07,8,32),new THREE.MeshBasicMaterial({color,transparent:true,opacity:.8}));ring.rotation.x=Math.PI/2;ring.position.copy(pos);ring.userData={owner:o};world.add(ring);o.userData.ring=ring;return o}
function edgeKey(endpoint,provider,model){return endpoint+'|'+provider+'|'+model}
function makeEdge(endpoint,modelId,from,to,provider){const curve=new THREE.QuadraticBezierCurve3(from.clone(),new THREE.Vector3((from.x+to.x)/2,Math.max(from.y,to.y)+1.1,((from.z+to.z)/2)+1.3),to.clone());const geo=new THREE.TubeGeometry(curve,36,.025,6,false);const mat=new THREE.MeshBasicMaterial({color:0x276270,transparent:true,opacity:.48});const mesh=new THREE.Mesh(geo,mat);mesh.userData={type:'edge',endpoint,modelId,provider,curve,active:0,particles:[]};world.add(mesh);const particleMat=new THREE.MeshBasicMaterial({color:0x8ffff7,transparent:true,opacity:0});for(let i=0;i<2;i++){const p=new THREE.Mesh(new THREE.SphereGeometry(.065,8,6),particleMat.clone());p.userData.offset=i*.5;world.add(p);mesh.userData.particles.push(p)}edgeMap.set(edgeKey(endpoint,provider,modelId),mesh)}
function clearWorld(){for(const o of [...world.children]){if(o!==grid){o.geometry?.dispose?.();o.material?.dispose?.();world.remove(o)}}nodeObjects.length=0;nodeMap.clear();edgeMap.clear()}
function buildGraph(data){topology=data||{endpoints:[],models:[],edges:[]};clearWorld();const endpoints=topology.endpoints||[],models=topology.models||[],edges=topology.edges||[];const epPos=new Map(),modelPos=new Map();
  endpoints.forEach((e,i)=>{const p=new THREE.Vector3(-7.2,(i-(endpoints.length-1)/2)*2.25,(i%2?1.2:-1.1));epPos.set(e.key,p);const n=sphere(p,0x43d7e9,.34,'endpoint',{key:e.key,name:e.displayName,path:e.publicPath,active:0});nodeMap.set('endpoint|'+e.key,n);const lab=labelSprite(e.displayName,'#a9f5fa',.82);lab.position.set(p.x-.1,p.y+.62,p.z);world.add(lab)});
  const providers=[...new Set(models.map(m=>m.providerId))]; providers.forEach((provider,pi)=>{const list=models.filter(m=>m.providerId===provider);const x=4.7+((pi%2)*1.1);list.forEach((m,mi)=>{const p=new THREE.Vector3(x,(mi-(list.length-1)/2)*1.55,((pi%2)*2-1)*1.6);modelPos.set(m.providerId+'|'+m.modelId,p);const n=sphere(p,0xf6c56b,.31,'model',{provider:m.providerId,name:m.displayName,id:m.modelId,active:0});nodeMap.set('model|'+m.providerId+'|'+m.modelId,n);const lab=labelSprite(m.displayName,'#ffe2a1',.7);lab.position.set(p.x+.05,p.y+.5,p.z);world.add(lab)})});
  providers.forEach((provider,pi)=>{const list=models.filter(m=>m.providerId===provider),center=new THREE.Vector3(5.3+((pi%2)*1.1),0,((pi%2)*2-1)*1.6);const box=new THREE.LineSegments(new THREE.EdgesGeometry(new THREE.BoxGeometry(4.2,Math.max(3.2,list.length*1.5+1.3),3.8)),new THREE.LineBasicMaterial({color:0xa9824c,transparent:true,opacity:.34}));box.position.copy(center);world.add(box);const lab=labelSprite('PROVIDER · '+provider,'#cfae71',.68);lab.position.set(center.x-1.85,center.y+Math.max(2,list.length*.75)+.25,center.z-1.5);world.add(lab)});
  edges.forEach(e=>{const a=epPos.get(e.endpointKey),b=modelPos.get(e.providerId+'|'+e.modelId);if(a&&b)makeEdge(e.endpointKey,e.modelId,a,b,e.providerId)});
  document.getElementById('empty').style.display=endpoints.length||models.length?'none':'flex';
  window.__overviewState.topologyApplied++;window.__overviewState.lastTopology={endpoints:endpoints.length,models:models.length,edges:edges.length};window.__overviewPostHost('graph-debug:'+JSON.stringify(window.__overviewDiagnostics()));
}
function setNodeActive(key,delta){const node=nodeMap.get(key);if(!node)return;node.userData.active=Math.max(0,(node.userData.active||0)+delta);const ring=node.userData.ring;if(ring){ring.material.color.setHex(node.userData.active?0x39e2b0:(node.userData.baseColor||0x43d7e9));ring.material.opacity=node.userData.active?.98:.8;ring.scale.setScalar(node.userData.active?1.25:1)}}
function setEdgeActive(key,active){const edge=edgeMap.get(key);if(!edge)return;const delta=active?1:-1;edge.userData.active=Math.max(0,edge.userData.active+delta);setNodeActive('endpoint|'+edge.userData.endpoint,delta);setNodeActive('model|'+edge.userData.provider+'|'+edge.userData.modelId,delta);const on=edge.userData.active>0;edge.material.color.setHex(on?0x43d7e9:0x276270);edge.material.opacity=on?1:.48;edge.material.needsUpdate=true;edge.userData.particles.forEach(p=>{p.material.opacity=on?1:0})}
function receiveTelemetry(e){if(!e)return;window.__overviewState.telemetryReceived++;const k=e.EndpointKey+'|'+e.ProviderId+'|'+e.ModelId;if(e.Kind==='RequestStarted'){activeRequests.add(e.RequestId);document.getElementById('active').textContent=activeRequests.size;return}if(e.Kind==='EdgeAttemptStarted'){let set=requestEdges.get(e.RequestId);if(!set){set=new Set();requestEdges.set(e.RequestId,set)}if(!set.has(k)){set.add(k);setEdgeActive(k,true)}return}if(['EdgeAttemptCompleted','EdgeAttemptFailed','EdgeAttemptCancelled'].includes(e.Kind)){const set=requestEdges.get(e.RequestId);if(set?.delete(k))setEdgeActive(k,false);return}if(e.Kind==='RequestCompleted'){activeRequests.delete(e.RequestId);document.getElementById('active').textContent=activeRequests.size;const set=requestEdges.get(e.RequestId);set?.forEach(key=>setEdgeActive(key,false));requestEdges.delete(e.RequestId);document.getElementById('rate').textContent=(e.ModelId||e.ModelAlias||'未知模型')+' · '+(e.ElapsedMs||0)+' ms'}}
function applyTopology(json){try{buildGraph(typeof json==='string'?JSON.parse(json):json)}catch(err){console.error(err)}}
function focusAll(){camera.position.set(0,2.8,19);camera.lookAt(0,0,0)}
const queued=window.__overviewQueue;window.applyTopology=applyTopology;window.receiveTelemetry=receiveTelemetry;window.fitTopology=focusAll;
queued.topologies.forEach(applyTopology);queued.telemetry.forEach(receiveTelemetry);queued.topologies.length=0;queued.telemetry.length=0;
window.__overviewPostHost('graph-ready');window.__overviewPostHost('graph-debug:'+JSON.stringify(window.__overviewDiagnostics()));
if(new URLSearchParams(location.search).has('demo')){applyTopology({endpoints:[{key:'openai',displayName:'OpenAI',publicPath:'/v1'},{key:'ollama',displayName:'Ollama',publicPath:'/api'},{key:'azure',displayName:'Azure',publicPath:'/azure/v1'}],models:[{displayName:'deepseek-chat',modelId:'deepseek-chat',providerId:'DeepSeek'},{displayName:'claude-sonnet',modelId:'claude-sonnet',providerId:'Anthropic'},{displayName:'qwen-plus',modelId:'qwen-plus',providerId:'DashScope'}],edges:[{endpointKey:'openai',modelId:'deepseek-chat',providerId:'DeepSeek'},{endpointKey:'ollama',modelId:'deepseek-chat',providerId:'DeepSeek'},{endpointKey:'azure',modelId:'deepseek-chat',providerId:'DeepSeek'},{endpointKey:'openai',modelId:'claude-sonnet',providerId:'Anthropic'},{endpointKey:'ollama',modelId:'qwen-plus',providerId:'DashScope'},{endpointKey:'azure',modelId:'qwen-plus',providerId:'DashScope'}]});receiveTelemetry({Kind:'RequestStarted',RequestId:'demo-1'});receiveTelemetry({Kind:'EdgeAttemptStarted',RequestId:'demo-1',EndpointKey:'openai',ProviderId:'DeepSeek',ModelId:'deepseek-chat'});receiveTelemetry({Kind:'EdgeAttemptStarted',RequestId:'demo-1',EndpointKey:'azure',ProviderId:'DashScope',ModelId:'qwen-plus'});}
function animate(t){world.rotation.y+=(yaw-world.rotation.y)*.08;world.rotation.x+=(pitch-world.rotation.x)*.08;edgeMap.forEach(edge=>{if(edge.userData.active<=0)return;edge.userData.particles.forEach((p,i)=>{const u=((t*.00032+p.userData.offset)%1);p.position.copy(edge.userData.curve.getPointAt(u))})});renderer.render(scene,camera)} renderer.setAnimationLoop(animate);
canvas.addEventListener('pointerdown',e=>{dragging=true;lastX=e.clientX;lastY=e.clientY;canvas.classList.add('dragging')});window.addEventListener('pointerup',()=>{dragging=false;canvas.classList.remove('dragging')});window.addEventListener('pointermove',e=>{if(dragging){yaw+=(e.clientX-lastX)*.004;pitch=Math.max(-.65,Math.min(.35,pitch+(e.clientY-lastY)*.003));lastX=e.clientX;lastY=e.clientY}pointer.x=(e.clientX/innerWidth)*2-1;pointer.y=-(e.clientY/innerHeight)*2+1;raycaster.setFromCamera(pointer,camera);const hit=raycaster.intersectObjects(nodeObjects)[0],tip=document.getElementById('tooltip');if(!hit){tip.style.display='none';return}const d=hit.object.userData;tip.innerHTML='<b>'+d.name+'</b><small>'+ (d.type==='endpoint'?(d.path||'公开 Endpoint'):'Provider · '+d.provider)+'</small><div class="stat"><span>当前活跃</span><span>'+((d.active||0)>0?d.active+' 个请求':'待命')+'</span></div>';tip.style.display='block';tip.style.left=Math.min(innerWidth-210,e.clientX+14)+'px';tip.style.top=Math.min(innerHeight-120,e.clientY+14)+'px'});canvas.addEventListener('wheel',e=>{camera.position.z=Math.max(11,Math.min(28,camera.position.z+e.deltaY*.012));camera.lookAt(0,0,0)},{passive:true});
</script>
</body></html>
