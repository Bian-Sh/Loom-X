<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#07131b;color:#dff7f8;font-family:Segoe UI,Microsoft YaHei,sans-serif;border-radius:9px}
#scene{display:block;width:100%;height:100%;cursor:grab}#scene.dragging{cursor:grabbing}
#hud{position:fixed;left:14px;top:12px;display:grid;grid-template-columns:repeat(3,minmax(70px,1fr));gap:7px;padding:7px 9px;border:1px solid #1c4652;border-radius:8px;background:#07151cdc;box-shadow:0 8px 24px #02080c66;pointer-events:none}
#hud .metric{min-width:70px}#hud .label{font-size:10px;color:#8eabb2;letter-spacing:.5px;white-space:nowrap}#hud .value{font-size:19px;font-weight:700;color:#ecffff;margin-top:1px}
#legend{position:fixed;left:14px;bottom:12px;display:flex;gap:11px;padding:6px 8px;border:1px solid #1c4652;border-radius:7px;background:#07151cbf;font-size:10px;color:#91adb5;pointer-events:none}
#legend i{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:4px}.ep{background:#43d7e9}.combo{background:#aa8cff}.provider{background:#cfaa71}.model{background:#f6c56b}
#tooltip{position:fixed;display:none;min-width:170px;padding:10px 12px;border-left:2px solid #43d7e9;border-radius:7px;background:#07151cf2;box-shadow:0 10px 26px #02080caa;font-size:11px;pointer-events:none}#tooltip b{font-size:13px;color:#ecffff}#tooltip small{display:block;color:#8eabb2;margin-top:3px}#tooltip .stat{display:flex;justify-content:space-between;margin-top:8px;color:#91adb5}#tooltip .stat span:last-child{color:#e1f8f8}
#empty{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;color:#7f9ea7;font-size:12px;pointer-events:none}
</style></head>
<body>
<canvas id="scene"></canvas>
<div id="hud"><div class="metric"><div class="label">活动请求</div><div class="value" id="active">0</div></div><div class="metric"><div class="label">5 分钟请求</div><div class="value" id="throughput">0</div></div><div class="metric"><div class="label">P95</div><div class="value" id="p95">—</div></div></div>
<div id="legend"><span><i class="ep"></i>Endpoint</span><span><i class="combo"></i>Combo</span><span><i class="provider"></i>Provider</span><span><i class="model"></i>Model</span></div>
<div id="tooltip"></div><div id="empty">等待拓扑快照…</div>
<script>
window.__overviewState={moduleLoaded:false,rendererReady:false,topologyApplied:0,metricsApplied:0,telemetryReceived:0,lastError:null,lastTopology:null,lastMetrics:null};
window.__overviewQueue={topologies:[],metrics:[],telemetry:[]};
window.__overviewPostHost=message=>{try{if(typeof invokeCSharpAction==='function')invokeCSharpAction(message)}catch(_){}};
window.__overviewDiagnostics=()=>({...window.__overviewState,queuedTopologies:window.__overviewQueue.topologies.length,queuedMetrics:window.__overviewQueue.metrics.length,queuedTelemetry:window.__overviewQueue.telemetry.length});
window.addEventListener('error',event=>{window.__overviewState.lastError=event.message||'script-error';window.__overviewPostHost('graph-error:'+String(window.__overviewState.lastError).slice(0,240))});
window.addEventListener('unhandledrejection',event=>{const reason=event.reason?.message||String(event.reason||'promise-rejection');window.__overviewState.lastError=reason;window.__overviewPostHost('graph-error:'+reason.slice(0,240))});
window.applyTopology=json=>window.__overviewQueue.topologies.push(json);window.applyMetrics=json=>window.__overviewQueue.metrics.push(json);window.receiveTelemetry=eventData=>window.__overviewQueue.telemetry.push(eventData);
</script>
<script type="module">
import * as THREE from './three.module.min.js';
window.__overviewState.moduleLoaded=true;
const canvas=document.getElementById('scene'),renderer=new THREE.WebGLRenderer({canvas,antialias:true,alpha:false});window.__overviewState.rendererReady=true;renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setClearColor(0x07131b,1);
const scene=new THREE.Scene();scene.fog=new THREE.Fog(0x07131b,14,40);const camera=new THREE.PerspectiveCamera(42,1,.1,100);const world=new THREE.Group();scene.add(world);scene.add(new THREE.AmbientLight(0x8bd4d8,.55));const keyLight=new THREE.PointLight(0x51d7e5,2.2,24);keyLight.position.set(-4,7,8);scene.add(keyLight);const grid=new THREE.GridHelper(26,26,0x1d5661,0x12343d);grid.position.y=-4.1;grid.material.transparent=true;grid.material.opacity=.34;world.add(grid);
const raycaster=new THREE.Raycaster(),pointer=new THREE.Vector2(),nodeObjects=[],nodeMap=new Map(),edgeMap=new Map(),labels=[],requestEdges=new Map(),activeRequests=new Set();let topology=null,dragging=false,lastX=0,lastY=0,yaw=0,pitch=-.1,cameraDistance=21;const cameraTarget=new THREE.Vector3(0,.65,0);
function resize(){const w=canvas.clientWidth||1,h=canvas.clientHeight||1;renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix()}window.addEventListener('resize',resize);resize();
function updateCamera(){const cp=Math.cos(pitch);camera.position.set(cameraTarget.x+Math.sin(yaw)*cp*cameraDistance,cameraTarget.y+Math.sin(pitch)*cameraDistance,cameraTarget.z+Math.cos(yaw)*cp*cameraDistance);camera.lookAt(cameraTarget)}
function setCameraState(distance=cameraDistance,nextYaw=0,nextPitch=-.1){cameraDistance=Math.max(11,Math.min(32,distance));yaw=nextYaw;pitch=Math.max(-.65,Math.min(.35,nextPitch));updateCamera()}
function fitTopology(){setCameraState(Math.max(18,Math.min(28,15+(topology?.endpoints?.length||1)*.8)),0,-.1)}window.fitTopology=fitTopology;window.resetCamera=fitTopology;
function labelSprite(text,color='#dff7f8',baseScale=1){const c=document.createElement('canvas');c.width=512;c.height=96;const x=c.getContext('2d');x.font='600 28px Segoe UI,Microsoft YaHei';x.fillStyle=color;x.fillText(text,14,56);const t=new THREE.CanvasTexture(c);t.minFilter=THREE.LinearFilter;const s=new THREE.Sprite(new THREE.SpriteMaterial({map:t,transparent:true,depthTest:false}));s.userData.baseScale=baseScale;s.scale.set(2.6*baseScale,.49*baseScale,1);labels.push(s);return s}
function sphere(pos,color,size,type,data){const g=new THREE.SphereGeometry(size,24,18),m=new THREE.MeshStandardMaterial({color,emissive:color,emissiveIntensity:.38,metalness:.35,roughness:.35});const o=new THREE.Mesh(g,m);o.position.copy(pos);o.userData={type,...data,baseColor:color};world.add(o);nodeObjects.push(o);const ring=new THREE.Mesh(new THREE.TorusGeometry(size*1.3,size*.07,8,32),new THREE.MeshBasicMaterial({color,transparent:true,opacity:.8}));ring.rotation.x=Math.PI/2;ring.position.copy(pos);ring.userData={owner:o};world.add(ring);o.userData.ring=ring;return o}
function edgeKey(endpoint,provider,model){return endpoint+'|'+provider+'|'+model}
function makeEdge(edge,from,to,visualKey){const curve=new THREE.QuadraticBezierCurve3(from.clone(),new THREE.Vector3((from.x+to.x)/2,Math.max(from.y,to.y)+.65,((from.z+to.z)/2)+.7),to.clone());const geo=new THREE.TubeGeometry(curve,28,edge.type==='route'?.028:.018,6,false);const mat=new THREE.MeshBasicMaterial({color:edge.type==='route'?0x276270:0x244d57,transparent:true,opacity:edge.type==='route'?.48:.34});const mesh=new THREE.Mesh(geo,mat);mesh.userData={type:'edge',endpoint:edge.endpointKey,modelId:edge.modelId,provider:edge.providerId,curve,active:0,particles:[]};world.add(mesh);if(edge.type==='route'){const particleMat=new THREE.MeshBasicMaterial({color:0x8ffff7,transparent:true,opacity:0});for(let i=0;i<2;i++){const p=new THREE.Mesh(new THREE.SphereGeometry(.065,8,6),particleMat.clone());p.userData.offset=i*.5;world.add(p);mesh.userData.particles.push(p)}edgeMap.set(visualKey,mesh)}}
function clearWorld(){for(const o of [...world.children]){if(o!==grid){o.geometry?.dispose?.();o.material?.dispose?.();world.remove(o)}}nodeObjects.length=0;nodeMap.clear();edgeMap.clear();labels.length=0}
function addNode(item,type,pos,color,size,key){const n=sphere(pos,color,size,type,{key:item.id||item.key,name:item.displayName||item.name,provider:item.providerId,id:item.modelId,path:item.publicPath,active:0});nodeMap.set(key,n);const lab=labelSprite(item.displayName||item.name||item.modelId,type==='endpoint'?'#a9f5fa':type==='combo'?'#cbbcff':type==='provider'?'#d5b77f':'#ffe2a1',type==='model'?.58:.68);lab.position.set(pos.x+.08,pos.y+size+.3,pos.z);world.add(lab)}
function buildGraph(data){topology=data||{endpoints:[],combos:[],providers:[],models:[],edges:[]};clearWorld();const endpoints=topology.endpoints||[],combos=topology.combos||[],providers=topology.providers||[],models=topology.models||[],edges=topology.edges||[];const positions=new Map();const col={endpoint:-8,combo:-3.4,provider:1.3,model:6.2};const place=(items,type,color,size,keyFn)=>items.forEach((item,i)=>{const per=Math.max(1,items.length),p=new THREE.Vector3(col[type],(i-(per-1)/2)*1.25,type==='provider'?(i%2)*1.25-0.6:type==='model'?(i%3-1)*.85:0);const key=keyFn(item);positions.set(key,p);addNode(item,type,p,color,size,key)});
place(endpoints,'endpoint',0x43d7e9,.35,e=>`endpoint|${e.key}`);place(combos,'combo',0xaa8cff,.29,c=>`combo|${c.id}`);place(providers,'provider',0xcfaa71,.33,p=>`provider|${p.id}`);place(models,'model',0xf6c56b,.3,m=>`model|${m.providerId}|${m.modelId}`);
const seen=new Set();edges.forEach(edge=>{const from=positions.get(`${edge.sourceType}|${edge.sourceId}`),to=positions.get(`${edge.targetType}|${edge.targetId}`);if(!from||!to)return;const dedupe=`${edge.type}|${edge.sourceId}|${edge.targetId}|${edge.providerId||''}|${edge.modelId||''}`;if(seen.has(dedupe))return;seen.add(dedupe);const key=edge.type==='route'?edgeKey(edge.endpointKey,edge.providerId,edge.modelId):dedupe;makeEdge(edge,from,to,key)});
document.getElementById('empty').style.display=endpoints.length||models.length||providers.length?'none':'flex';window.__overviewState.topologyApplied++;window.__overviewState.lastTopology={endpoints:endpoints.length,combos:combos.length,providers:providers.length,models:models.length,edges:edges.length};window.__overviewPostHost('graph-debug:'+JSON.stringify(window.__overviewDiagnostics()));fitTopology()}
function setNodeActive(key,delta){const node=nodeMap.get(key);if(!node)return;node.userData.active=Math.max(0,(node.userData.active||0)+delta);const ring=node.userData.ring;if(ring){ring.material.color.setHex(node.userData.active?0x39e2b0:node.userData.baseColor||0x43d7e9);ring.material.opacity=node.userData.active?.98:.8;ring.scale.setScalar(node.userData.active?1.25:1)}}
function setEdgeActive(key,active){const edge=edgeMap.get(key);if(!edge)return;const delta=active?1:-1;edge.userData.active=Math.max(0,edge.userData.active+delta);setNodeActive('endpoint|'+edge.userData.endpoint,delta);setNodeActive('provider|'+edge.userData.provider,delta);setNodeActive('model|'+edge.userData.provider+'|'+edge.userData.modelId,delta);const on=edge.userData.active>0;edge.material.color.setHex(on?0x43d7e9:0x276270);edge.material.opacity=on?1:.48;edge.userData.particles.forEach(p=>p.material.opacity=on?1:0)}
function applyMetrics(json){try{const data=typeof json==='string'?JSON.parse(json):json||{};document.getElementById('active').textContent=data.activeRequests??0;document.getElementById('throughput').textContent=data.throughput??0;document.getElementById('p95').textContent=data.p95Latency||'—';window.__overviewState.metricsApplied++;window.__overviewState.lastMetrics={activeRequests:data.activeRequests??0,throughput:data.throughput??0,p95Latency:data.p95Latency||'—'}}catch(err){window.__overviewState.lastError=err?.message||String(err);window.__overviewPostHost('graph-error:'+String(window.__overviewState.lastError).slice(0,240))}}
function receiveTelemetry(e){if(!e)return;window.__overviewState.telemetryReceived++;const k=edgeKey(e.EndpointKey,e.ProviderId,e.ModelId);if(e.Kind==='RequestStarted'){activeRequests.add(e.RequestId);document.getElementById('active').textContent=activeRequests.size;return}if(e.Kind==='EdgeAttemptStarted'){let set=requestEdges.get(e.RequestId);if(!set){set=new Set();requestEdges.set(e.RequestId,set)}if(!set.has(k)){set.add(k);setEdgeActive(k,true)}return}if(['EdgeAttemptCompleted','EdgeAttemptFailed','EdgeAttemptCancelled'].includes(e.Kind)){const set=requestEdges.get(e.RequestId);if(set?.delete(k))setEdgeActive(k,false);return}if(e.Kind==='RequestCompleted'){activeRequests.delete(e.RequestId);document.getElementById('active').textContent=activeRequests.size;const set=requestEdges.get(e.RequestId);set?.forEach(key=>setEdgeActive(key,false));requestEdges.delete(e.RequestId)}}
function applyTopology(json){try{buildGraph(typeof json==='string'?JSON.parse(json):json)}catch(err){window.__overviewState.lastError=err?.message||String(err);window.__overviewPostHost('graph-error:'+String(window.__overviewState.lastError).slice(0,240))}}
const queued=window.__overviewQueue;window.applyTopology=applyTopology;window.applyMetrics=applyMetrics;window.receiveTelemetry=receiveTelemetry;queued.topologies.forEach(applyTopology);queued.metrics.forEach(applyMetrics);queued.telemetry.forEach(receiveTelemetry);queued.topologies.length=0;queued.metrics.length=0;queued.telemetry.length=0;window.__overviewPostHost('graph-ready');window.__overviewPostHost('graph-debug:'+JSON.stringify(window.__overviewDiagnostics()));
function updateLabelScale(){labels.forEach(label=>{const distance=camera.position.distanceTo(label.position);const scale=Math.max(.42,Math.min(1.15,22/distance))*label.userData.baseScale;label.scale.set(2.6*scale,.49*scale,1)})}
function animate(t){world.rotation.y+=(yaw-world.rotation.y)*.08;world.rotation.x+=(pitch-world.rotation.x)*.08;updateLabelScale();edgeMap.forEach(edge=>{if(edge.userData.active<=0)return;edge.userData.particles.forEach((p,i)=>{const u=((t*.00032+p.userData.offset)%1);p.position.copy(edge.userData.curve.getPointAt(u))})});renderer.render(scene,camera)}renderer.setAnimationLoop(animate);
canvas.addEventListener('pointerdown',e=>{dragging=true;lastX=e.clientX;lastY=e.clientY;canvas.classList.add('dragging')});window.addEventListener('pointerup',()=>{dragging=false;canvas.classList.remove('dragging')});window.addEventListener('pointermove',e=>{if(dragging){yaw+=(e.clientX-lastX)*.004;pitch=Math.max(-.65,Math.min(.35,pitch+(e.clientY-lastY)*.003));lastX=e.clientX;lastY=e.clientY;updateCamera()}pointer.x=(e.clientX/innerWidth)*2-1;pointer.y=-(e.clientY/innerHeight)*2+1;raycaster.setFromCamera(pointer,camera);const hit=raycaster.intersectObjects(nodeObjects)[0],tip=document.getElementById('tooltip');if(!hit){tip.style.display='none';return}const d=hit.object.userData;tip.innerHTML='<b>'+d.name+'</b><small>'+ (d.type==='endpoint'?(d.path||'公开 Endpoint'):d.type==='model'?('Provider · '+d.provider):d.type==='provider'?'Provider':'Endpoint · '+d.key)+'</small><div class="stat"><span>当前活跃</span><span>'+((d.active||0)>0?d.active+' 个请求':'待命')+'</span></div>';tip.style.display='block';tip.style.left=Math.min(innerWidth-210,e.clientX+14)+'px';tip.style.top=Math.min(innerHeight-120,e.clientY+14)+'px'});canvas.addEventListener('wheel',e=>{cameraDistance=Math.max(11,Math.min(32,cameraDistance+e.deltaY*.012));updateCamera()},{passive:true});setCameraState(21,0,-.1);
</script></body></html>
